document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ench<\u002Fspan>\n      <a href=\"https://github.com/ConstantinVictorBeatErtel/swivelbench\" target=\"_blank\" rel=\"noreferrer\" style=\"color:#6b6b64\">GitHub ↗<\u002Fa>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;gap:34px;padding:140px 0 0;max-width:960px;animation:swv-rise 900ms cubic-bezier(.2,.8,.2,1) both\">\n      <h1 style=\"margin:0;font-family:Spectral,Georgia,serif;font-weight:200;font-size:clamp(50px,7.6vw,116px);line-height:0.98;letter-spacing:-0.035em;text-wrap:balance\">Swivel-chair work,<br><em style=\"font-weight:300\">made verifiable.<\u002Fem><\u002Fh1>\n      <p style=\"margin:0;max-width:620px;font-size:18px;line-height:1.6;color:#45453f;text-wrap:pretty\">An agent works a real enterprise job across two systems that share no keys, touching them only through a typed tool API. When it stops, a deterministic verifier reads the databases it left behind — never the transcript — and checks them against a rubric an expert wrote.<\u002Fp>\n    <\u002Fdiv>\n\n    <div data-reveal=\"0\" style=\"height:1px;margin:120px 0 0;background:rgba(17,17,16,0.14)\"><\u002Fdiv>\n\n    <div data-reveal=\"60\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:28px;padding:34px 0 30px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ envTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n          <div sc-camel-on-click=\"{{ t.select }}\" style=\"padding:10px 18px;border-radius:100px;border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }};font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;letter-spacing:0.06em;cursor:pointer;transition:all 200ms\" style-hover=\"border-color:#111110\">{{ t.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n        <sc-for list=\"{{ modelTabs }}\" as=\"m\" hint-placeholder-count=\"2\">\n          <div sc-camel-on-click=\"{{ m.select }}\" style=\"padding:10px 18px;border-radius:100px;border:1px solid {{ m.border }};background:{{ m.bg }};color:{{ m.fg }};font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;letter-spacing:0.06em;cursor:pointer;transition:all 200ms\" style-hover=\"border-color:#111110\">{{ m.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n        <div sc-camel-on-click=\"{{ runVerifier }}\" style=\"padding:10px 18px;border-radius:100px;background:#111110;color:#ffffff;font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;letter-spacing:0.06em;cursor:pointer;transition:opacity 200ms\" style-hover=\"opacity:0.78\">{{ runLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"140\" style=\"display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:0;border:1px solid rgba(17,17,16,0.13);border-radius:5px;background:rgba(17,17,16,0.012);overflow:hidden\">\n\n      <div style=\"padding:34px;border-right:1px solid rgba(17,17,16,0.1)\">\n        <div sc-camel-on-mouse-leave=\"{{ clearActive }}\" style=\"display:grid;grid-template-columns:repeat(9,1fr);gap:9px\">\n          <sc-for list=\"{{ cells }}\" as=\"c\" hint-placeholder-count=\"35\">\n            <div sc-camel-on-mouse-enter=\"{{ c.hover }}\" sc-camel-on-click=\"{{ c.hover }}\" style=\"position:relative;aspect-ratio:1/1;border-radius:2px;cursor:crosshair;will-change:transform;background:{{ c.bg }};border:1px solid {{ c.border }};box-shadow:{{ c.shadow }};transform:{{ c.transform }};animation:{{ c.anim }};animationDelay:{{ c.delay }};transition:background 300ms cubic-bezier(.2,.8,.2,1),border-color 240ms,box-shadow 300ms,transform 420ms cubic-bezier(.16,1.1,.3,1)\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-top:30px;padding-top:22px;border-top:1px solid rgba(17,17,16,0.1);min-height:46px\">\n          <span style=\"font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;letter-spacing:0.06em;color:{{ activeIdColor }}\">{{ activeId }}<\u002Fspan>\n          <span style=\"flex:1;min-width:200px;font-size:15px;line-height:1.55;color:#45453f;text-wrap:pretty\">{{ activeText }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;justify-content:space-between;padding:34px\">\n        <div>\n          <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px\">\n            <div style=\"font-family:Spectral,Georgia,serif;font-weight:200;font-size:82px;line-height:0.86;letter-spacing:-0.04em\">{{ score }}<\u002Fdiv>\n            <div style=\"font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;text-align:right;color:#8a8a80;line-height:1.7\">{{ metCount }}<br>criteria met<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;height:3px;margin-top:26px;background:rgba(17,17,16,0.1);border-radius:2px;overflow:hidden\">\n            <div style=\"position:absolute;inset:0 auto 0 0;width:{{ scorePct }};background:#111110;transition:width 520ms cubic-bezier(.2,.8,.2,1)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:16px;font-size:15px;line-height:1.6;color:#45453f;text-wrap:pretty\">{{ verdict }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;gap:12px;margin-top:40px\">\n          <sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"4\">\n            <div sc-camel-on-mouse-enter=\"{{ l.focus }}\" sc-camel-on-mouse-leave=\"{{ l.blur }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 14px;border-radius:3px;border:1px solid {{ l.border }};background:{{ l.bg }};cursor:default;transition:all 200ms\">\n              <span style=\"font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;letter-spacing:0.04em;color:#33332e\">{{ l.name }}<\u002Fspan>\n              <span style=\"font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;color:#8a8a80\">{{ l.count }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"0\" style=\"height:1px;margin:130px 0 0;background:rgba(17,17,16,0.14)\"><\u002Fdiv>\n\n    <div data-reveal=\"80\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:60px;padding:46px 0 0\">\n      <div>\n        <h2 style=\"margin:0;font-family:Spectral,Georgia,serif;font-weight:200;font-size:clamp(32px,3.6vw,52px);line-height:1.04;letter-spacing:-0.03em;text-wrap:balance\">{{ envName }}<\u002Fh2>\n        <p style=\"margin:20px 0 0;font-size:16.5px;line-height:1.62;color:#45453f;max-width:400px;text-wrap:pretty\">{{ envBlurb }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:0;align-content:start\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"7\">\n          <div sc-camel-on-mouse-enter=\"{{ s.select }}\" sc-camel-on-click=\"{{ s.select }}\" style=\"display:grid;grid-template-columns:14px 1fr;gap:20px;align-items:start;padding:20px 4px;border-bottom:1px solid rgba(17,17,16,0.09);cursor:pointer;background:{{ s.bg }};transition:background 220ms\">\n            <div style=\"height:1px;margin-top:11px;background:{{ s.tick }};transform:{{ s.tickScale }};transform-origin:left;transition:background 260ms,transform 420ms cubic-bezier(.2,.8,.2,1)\"><\u002Fdiv>\n            <div>\n              <div style=\"font-size:18px;letter-spacing:-0.012em;color:{{ s.fg }};transition:color 220ms\">{{ s.name }}<\u002Fdiv>\n              <sc-if value=\"{{ s.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:9px;max-width:440px;font-size:15px;line-height:1.6;color:#5b5b54;text-wrap:pretty\">{{ s.detail }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"60\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:44px;margin:130px 0 0;padding-top:44px;border-top:1px solid rgba(17,17,16,0.14)\">\n      <sc-for list=\"{{ tracks }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <div>\n          <div style=\"font-family:Spectral,Georgia,serif;font-weight:300;font-size:23px;letter-spacing:-0.02em\">{{ t.k }}<\u002Fdiv>\n          <p style=\"margin:12px 0 0;font-size:15.5px;line-height:1.62;color:#45453f;text-wrap:pretty\">{{ t.v }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div data-reveal=\"0\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:20px;margin:110px 0 0;padding:26px 0 46px;border-top:1px solid rgba(17,17,16,0.14);font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.11em;text-transform:uppercase;color:#8a8a80\">\n      <span>SwivelBench · MIT<\u002Fspan>\n      <a href=\"https://github.com/ConstantinVictorBeatErtel/swivelbench\" target=\"_blank\" rel=\"noreferrer\">github.com/ConstantinVictorBeatErtel/swivelbench ↗<\u002Fa>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst DATA = {\n  banking: {\n    name: \"Commercial banking\",\n    systems: \"credit_workbench   ·   ncino_core\",\n    blurb: \"A credit request worked end to end, from a blank template to a booked deal in the second system. The fixture ships corrupt templates, superseded statements and archived duplicate customers.\",\n    groups: [\n      { key: \"M\", name: \"Model build\", n: 8, sample: \"the loan schedule amortises to zero at maturity\" },\n      { key: \"F\", name: \"Spreading\", n: 9, sample: \"the most recent audited statement supersedes the draft\" },\n      { key: \"P\", name: \"Credit memo\", n: 10, sample: \"the memo cites the covenant it recommends\" },\n      { key: \"T\", name: \"System transfer\", n: 8, sample: \"the deal lands on the live customer, not the archived duplicate\" }\n    ],\n    steps: [\n      { name: \"Open the template\", detail: \"Fetch the sanctioned model template and reject the corrupted copy sitting beside it.\" },\n      { name: \"Select products\", detail: \"Read the request, pick the facilities, and price each one from the product catalogue.\" },\n      { name: \"Build the model\", detail: \"Write the amortisation, the covenants, and the sensitivity case into the workbook.\" },\n      { name: \"Spread the statements\", detail: \"Map each line of the financials to the standard schema, keeping the audited figures over the drafts.\" },\n      { name: \"Write the memo\", detail: \"Assemble the credit report from the model — every figure it quotes must reconcile to the workbook.\" },\n      { name: \"Resolve the customer\", detail: \"Find the live customer record among near-duplicates before anything is written.\" },\n      { name: \"Push to the core\", detail: \"Book the deal in the second system so both databases agree, field for field.\" }\n    ],\n    unmet: [\"T1\",\"T2\",\"T3\",\"T4\",\"T5\",\"T6\",\"T7\",\"T8\",\"P4\",\"P8\",\"F2\"]\n  },\n  grading: {\n    name: \"Grading\",\n    systems: \"inbox   ·   gradescope\",\n    blurb: \"A teaching assistant's queue worked end to end, from a rubric buried in an email thread to a closed regrade pile. The fixture ships a rubric the instructor revised twice, late submissions, and regrade requests that contradict each other.\",\n    groups: [\n      { key: \"R\", name: \"Rubric\", n: 7, sample: \"the published rubric matches the instructor's last word on it\" },\n      { key: \"G\", name: \"Grading\", n: 10, sample: \"every submission in the queue carries a score\" },\n      { key: \"C\", name: \"Consistency\", n: 4, sample: \"identical answers receive identical marks\" },\n      { key: \"T\", name: \"Regrades\", n: 5, sample: \"each regrade is resolved and answered in the thread\" }\n    ],\n    steps: [\n      { name: \"Settle the rubric\", detail: \"Reconstruct the rubric from a thread where the instructor changed their mind twice.\" },\n      { name: \"Read the queue\", detail: \"Take the submissions in the order the queue gives them, including the late ones.\" },\n      { name: \"Grade\", detail: \"Score against the published rubric and leave a gradesheet a student could follow.\" },\n      { name: \"Close the regrades\", detail: \"Answer every open request, adjusting the score only where the rubric supports it.\" }\n    ],\n    unmet: [\"T1\",\"T2\",\"T4\",\"T5\"]\n  }\n};\n\nclass Component extends DCLogic {\n  state = { env: \"banking\", model: \"nemotron\", active: null, focus: null, step: 0, runKey: 0 };\n\n  componentDidMount() {\n    const start = () => {\n      const root = this._page;\n      if (!root) return;\n      const els = [].slice.call(root.querySelectorAll(\"[data-reveal]\"));\n      els.forEach(el => {\n        el.style.opacity = \"0\";\n        el.style.transform = \"translateY(22px)\";\n        el.style.transition = \"opacity 900ms cubic-bezier(.2,.8,.2,1), transform 900ms cubic-bezier(.2,.8,.2,1)\";\n        el.style.transitionDelay = (parseInt(el.getAttribute(\"data-reveal\") || \"0\", 10)) + \"ms\";\n      });\n      const show = el => { el.style.opacity = \"1\"; el.style.transform = \"none\"; };\n      let pending = els.slice();\n      this._check = () => {\n        const h = window.innerHeight;\n        pending = pending.filter(el => {\n          const t = el.getBoundingClientRect().top;\n          if (t < h * 0.88) { show(el); return false; }\n          return true;\n        });\n        if (!pending.length && this._check) {\n          window.removeEventListener(\"scroll\", this._check);\n          this._check = null;\n        }\n      };\n      window.addEventListener(\"scroll\", this._check, { passive: true });\n      window.addEventListener(\"resize\", this._check, { passive: true });\n      this._check();\n      // watchdog: nothing stays hidden if scroll events never arrive\n      this._wd = setTimeout(() => { pending.forEach(show); pending = []; }, 2500);\n    };\n    setTimeout(start, 30);\n\n    this._onScroll = () => {\n      if (!this._bar) return;\n      const h = document.documentElement.scrollHeight - window.innerHeight;\n      this._bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + \"%\";\n    };\n    window.addEventListener(\"scroll\", this._onScroll, { passive: true });\n    this._onScroll();\n\n  }\n\n  componentWillUnmount() {\n    if (this._wd) clearTimeout(this._wd);\n    if (this._check) { window.removeEventListener(\"scroll\", this._check); window.removeEventListener(\"resize\", this._check); }\n    if (this._onScroll) window.removeEventListener(\"scroll\", this._onScroll);\n  }\n\n  field() {\n    const d = DATA[this.state.env];\n    const unmet = this.state.model === \"oracle\" ? [] : d.unmet;\n    const out = [];\n    d.groups.forEach(g => {\n      for (let i = 1; i <= g.n; i++) {\n        const id = g.key + i;\n        out.push({ id, group: g.key, groupName: g.name, ok: unmet.indexOf(id) === -1, sample: g.sample });\n      }\n    });\n    return out;\n  }\n\n  setEnv(env) { this.setState(s => ({ env, active: null, step: 0, runKey: s.runKey + 1 })); }\n  setModel(model) { this.setState({ model, active: null }); }\n\n  // the sweep is pure CSS: bumping runKey swaps the keyframe name, restarting the stagger\n  run = () => { this.setState(s => ({ runKey: s.runKey + 1, active: null })); };\n\n  renderVals() {\n    const d = DATA[this.state.env];\n    const cells = this.field();\n    const met = cells.filter(c => c.ok).length;\n    const focus = this.state.focus;\n    const popName = this.state.runKey % 2 === 0 ? \"swv-pop\" : \"swv-pop-b\";\n\n    const tab = (on) => on\n      ? { border: \"#111110\", bg: \"#111110\", fg: \"#ffffff\" }\n      : { border: \"rgba(17,17,16,0.18)\", bg: \"transparent\", fg: \"#33332e\" };\n\n    const active = this.state.active;\n    const activeCell = active ? cells.filter(c => c.id === active)[0] : null;\n\n    return {\n      pageRef: (el) => { this._page = el; },\n      barRef: (el) => { this._bar = el; },\n      glowRef: (el) => { this._glow = el; },\n      onMove: (e) => {\n        if (!this._glow || !this._page) return;\n        const r = this._page.getBoundingClientRect();\n        this._glow.style.transform = \"translate(\" + (e.clientX - r.left) + \"px,\" + (e.clientY - r.top) + \"px)\";\n      },\n\n      envTabs: Object.keys(DATA).map(k => Object.assign({\n        label: DATA[k].name, select: () => this.setEnv(k)\n      }, tab(this.state.env === k))),\n\n      modelTabs: [\n        Object.assign({ label: \"Oracle\", select: () => this.setModel(\"oracle\") }, tab(this.state.model === \"oracle\")),\n        Object.assign({ label: \"Nemotron 3 Super\", select: () => this.setModel(\"nemotron\") }, tab(this.state.model === \"nemotron\"))\n      ],\n      runLabel: \"Run verifier\",\n      runVerifier: this.run,\n\n      cells: cells.map((c, i) => {\n        const dim = focus && focus !== c.group;\n        const ai = activeCell ? cells.indexOf(activeCell) : -1;\n        let d = 9;\n        if (ai >= 0) d = Math.max(Math.abs((i % 9) - (ai % 9)), Math.abs(Math.floor(i / 9) - Math.floor(ai / 9)));\n        const lift = d === 0 ? 1.22 : d === 1 ? 1.09 : d === 2 ? 1.03 : 1;\n        return {\n          bg: c.ok ? (dim ? \"rgba(17,17,16,0.16)\" : (d === 0 ? \"#000000\" : \"#1b1b18\")) : \"transparent\",\n          border: c.ok ? \"transparent\" : (dim ? \"rgba(17,17,16,0.14)\" : \"rgba(17,17,16,0.42)\"),\n          shadow: d === 0 ? \"0 6px 18px rgba(17,17,16,0.22)\" : \"none\",\n          transform: \"scale(\" + lift + \")\",\n          anim: popName + \" 460ms cubic-bezier(.2,.9,.25,1) both\" + (!c.ok && !dim ? \", swv-pulse 3.2s ease-in-out infinite 1.6s\" : \"\"),\n          delay: (i * 26) + \"ms\",\n          hover: () => this.setState({ active: c.id })\n        };\n      }),\n      clearActive: () => this.setState({ active: null }),\n\n      activeId: activeCell ? activeCell.id + \" · \" + activeCell.groupName : \"hover the field\",\n      activeIdColor: activeCell ? \"#111110\" : \"#a3a39a\",\n      activeText: activeCell\n        ? (activeCell.ok ? \"satisfied — \" : \"unmet — \") + activeCell.sample\n        : \"Each square is one rubric criterion, checked in SQL against the two databases the run left behind.\",\n\n      score: String(Math.round((met / cells.length) * 100)),\n      metCount: met + \" / \" + cells.length,\n      scorePct: Math.round((met / cells.length) * 100) + \"%\",\n      verdict: met === cells.length\n        ? \"Whole field filled. The task passes.\"\n        : \"Partial credit trains and diagnoses well, but it never becomes a pass: one unmet criterion fails the task.\",\n\n      legend: d.groups.map(g => ({\n        name: g.name,\n        count: cells.filter(c => c.group === g.key && c.ok).length + \" / \" + g.n,\n        border: focus === g.key ? \"#111110\" : \"rgba(17,17,16,0.12)\",\n        bg: focus === g.key ? \"rgba(17,17,16,0.04)\" : \"transparent\",\n        focus: () => this.setState({ focus: g.key }),\n        blur: () => this.setState({ focus: null })\n      })),\n\n      envName: d.name,\n      envSystems: d.systems,\n      envBlurb: d.blurb,\n      steps: d.steps.map((s, i) => ({\n        name: s.name,\n        detail: s.detail,\n        open: this.state.step === i,\n        bg: this.state.step === i ? \"rgba(17,17,16,0.03)\" : \"transparent\",\n        tick: this.state.step === i ? \"#111110\" : \"rgba(17,17,16,0.28)\",\n        tickScale: this.state.step === i ? \"scaleX(2.6)\" : \"scaleX(1)\",\n        fg: this.state.step === i ? \"#111110\" : \"#6b6b64\",\n        select: () => this.setState({ step: i })\n      })),\n\n      tracks: [\n        { k: \"Training track\", v: \"One self-contained prompt per workflow step, each starting from gold snapshot state. Short episodes, mixed difficulty, dense reward.\" },\n        { k: \"Eval track\", v: \"One thin orchestrator prompt for the whole job, scored by the same rubric. This is where composition and long-horizon behaviour show up.\" },\n        { k: \"Adversarial suite\", v: \"Wrong end states are built by perturbing a correct rollout through the real action API, so every one is a state an agent could actually reach.\" }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
