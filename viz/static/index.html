<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SwivelBench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #141414;
      --mute: #6b6b66;
      --line: rgba(20,20,20,0.1);
      --ok: #1a7a4c;
      --bad: #c43c3c;
      --node: #fff;
      --glow: rgba(20,20,20,0.06);
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(900px 480px at 80% -10%, rgba(26,122,76,0.07), transparent 55%),
        var(--bg);
      color: var(--ink);
      font: 400 15px/1.45 Outfit, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .shell { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }

    .top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 24px; margin-bottom: 28px;
    }
    .brand {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 28px; letter-spacing: -0.02em;
    }
    .brand span { color: var(--mute); font-style: italic; }
    select {
      appearance: none; border: 1px solid var(--line); background: #fff;
      border-radius: 999px; padding: 9px 34px 9px 14px; font: 500 13px Outfit;
      color: var(--ink);
      background-image:
        linear-gradient(45deg, transparent 50%, var(--mute) 50%),
        linear-gradient(135deg, var(--mute) 50%, transparent 50%);
      background-position: calc(100% - 14px) 54%, calc(100% - 10px) 54%;
      background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
      max-width: min(440px, 58vw);
    }
    .score {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 56px; line-height: 1; letter-spacing: -0.03em;
      text-align: right;
    }
    .score small {
      display: block; margin-top: 6px;
      font: 500 12px/1.35 Outfit, sans-serif;
      color: var(--mute); letter-spacing: 0;
      max-width: 280px; margin-left: auto;
    }
    .grade {
      display: inline-block; margin-top: 10px; padding: 5px 9px;
      border-radius: 999px; font: 600 11px/1 Outfit, sans-serif;
      letter-spacing: .08em;
    }
    .grade.pass { color: var(--ok); background: rgba(26,122,76,0.1); }
    .grade.fail { color: var(--bad); background: rgba(196,60,60,0.1); }
    .grade.invalid { color: var(--mute); background: rgba(20,20,20,0.07); }
    .story {
      color: var(--mute);
      font-size: 14px;
      max-width: 52rem;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    .graph-wrap {
      position: relative;
      padding: 28px 8px 8px;
      margin-bottom: 36px;
    }
    svg.edges {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: visible;
    }
    .nodes {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    .node {
      border: 0; background: transparent; cursor: pointer;
      padding: 0; text-align: center; color: inherit;
      font: inherit;
    }
    .orb {
      width: 64px; height: 64px; margin: 0 auto 14px;
      border-radius: 50%;
      background: var(--node);
      border: 1px solid var(--line);
      box-shadow: 0 10px 30px var(--glow);
      display: grid; place-items: center;
      transition: transform .25s ease, border-color .2s, box-shadow .25s;
      font: 500 13px/1 Outfit, sans-serif;
      color: var(--mute);
    }
    .node:hover .orb, .node.on .orb {
      transform: translateY(-3px) scale(1.04);
      border-color: var(--ink);
      box-shadow: 0 16px 40px rgba(20,20,20,0.12);
      color: var(--ink);
    }
    .node.bad .orb { border-color: rgba(196,60,60,0.45); color: var(--bad); }
    .node.bad.on .orb, .node.bad:hover .orb {
      border-color: var(--bad);
      box-shadow: 0 16px 40px rgba(196,60,60,0.12);
    }
    .node.good .orb { border-color: rgba(26,122,76,0.4); }
    .node.good.on .orb { border-color: var(--ok); color: var(--ok); }
    .label {
      font-size: 13px; font-weight: 500; line-height: 1.25;
      max-width: 12ch; margin: 0 auto 6px;
    }
    .frac {
      font: 500 12px/1 Outfit, sans-serif;
      color: var(--mute);
    }
    .frac.ok { color: var(--ok); }
    .frac.no { color: var(--bad); }

    .detail {
      display: grid; grid-template-columns: 1.35fr 0.65fr; gap: 20px;
    }
    @media (max-width: 820px) {
      .top { flex-wrap: wrap; }
      .score { text-align: left; }
      .score small { margin-left: 0; }
      .detail { grid-template-columns: 1fr; }
      .nodes { min-width: 720px; }
      .graph-wrap { overflow-x: auto; }
    }
    .pane {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 26px 28px;
      min-height: 280px;
    }
    .pane h2 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 26px; font-weight: 400; margin-bottom: 8px;
    }
    .blurb {
      color: var(--mute);
      font-size: 14px;
      margin-bottom: 22px;
      max-width: 40rem;
    }
    .row {
      display: grid; grid-template-columns: 72px 1fr;
      gap: 14px; align-items: start;
      padding: 16px 0; border-top: 1px solid var(--line);
    }
    .row:first-of-type { border-top: 0; padding-top: 0; }
    .tag {
      font: 500 11px/1 Outfit, sans-serif;
      padding: 6px 8px; border-radius: 6px; width: fit-content;
    }
    .tag.pass { background: rgba(26,122,76,0.1); color: var(--ok); }
    .tag.fail { background: rgba(196,60,60,0.1); color: var(--bad); }
    .row strong {
      display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px;
    }
    .why {
      display: block; font-size: 13px; color: var(--mute); line-height: 1.45;
    }
    .meta {
      margin-top: 8px;
      font-size: 12px;
      color: var(--mute);
    }
    .meta em {
      font-style: normal;
      color: var(--ink);
      font-weight: 500;
    }
    .file, .act {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 10px 0; border-top: 1px solid var(--line);
      font-size: 13px;
    }
    .file:first-of-type, .act:first-of-type { border-top: 0; }
    a.dl {
      color: var(--ok); text-decoration: none; font-weight: 500;
      border-bottom: 1px solid rgba(26,122,76,0.3);
    }
    .soft { color: var(--mute); font-size: 13px; }
    .empty { color: var(--mute); font-size: 13px; padding-top: 8px; }
    .sec {
      font: 500 11px/1 Outfit, sans-serif;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--mute); margin: 18px 0 6px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div>
        <div class="brand">SwivelBench <span>in words</span></div>
        <select id="run" style="margin-top:14px"></select>
      </div>
      <div class="score" id="score">—<small id="sub">—</small></div>
    </div>
    <p class="story" id="story"></p>

    <div class="graph-wrap" id="gwrap">
      <svg class="edges" id="edges"></svg>
      <div class="nodes" id="nodes"></div>
    </div>

    <div class="detail">
      <div class="pane">
        <h2 id="title">—</h2>
        <p class="blurb" id="blurb"></p>
        <div id="grades"></div>
      </div>
      <div class="pane">
        <h2>What ran</h2>
        <div class="sec">Files</div>
        <div id="files"></div>
        <div class="sec">Tools used</div>
        <div id="tools"></div>
      </div>
    </div>
  </div>

  <script>
    let cur = null, active = 0;
    const $ = (id) => document.getElementById(id);

    async function boot() {
      const { runs } = await (await fetch('/api/runs')).json();
      const sel = $('run');
      sel.innerHTML = '';
      if (!runs.length) {
        sel.innerHTML = '<option>No runs yet — materialize a baseline first</option>';
        return;
      }
      for (const r of runs) {
        const o = document.createElement('option');
        o.value = r.run_id;
        const model = (r.model || 'unknown').split('/').pop();
        const status = r.eligible_for_aggregate ? (r.task_passed ? 'PASS' : 'FAIL') : 'INVALID';
        const count = r.criteria_total == null ? '—' : `${r.criteria_passed}/${r.criteria_total}`;
        o.textContent = `${r.task} · ${model} · ${status} · ${count}`;
        sel.appendChild(o);
      }
      sel.onchange = () => load(sel.value);
      await load(runs[0].run_id);
      window.addEventListener('resize', drawEdges);
    }

    async function load(id) {
      cur = await (await fetch('/api/run/' + encodeURIComponent(id))).json();
      const r = cur.run;
      const systems = (r.systems || []).join(' ↔ ') || r.domain;
      const rate = r.criterion_pass_rate == null ? null : Number(r.criterion_pass_rate);
      const passed = r.task_passed === true;
      const valid = r.eligible_for_aggregate === true;
      const count = r.criteria_total == null ? 'criteria unavailable' : `${r.criteria_passed}/${r.criteria_total} criteria`;
      const badge = valid ? (passed ? 'PASS' : 'FAIL') : 'INVALID RUN';
      const badgeClass = valid ? (passed ? 'pass' : 'fail') : 'invalid';
      $('score').innerHTML =
        `${rate == null ? '—' : rate.toFixed(4)}<small>${count} · ${esc(systems)}<br><span class="grade ${badgeClass}">${badge}</span></small>`;
      $('story').textContent = r.story || '';
      paintGraph();
      pick(0);
    }

    function paintGraph() {
      const box = $('nodes');
      box.innerHTML = '';
      cur.graph.forEach((s, i) => {
        const fail = s.score.total - s.score.passed;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'node ' + (fail ? 'bad' : 'good');
        b.innerHTML = `
          <div class="orb">${String(i+1).padStart(2,'0')}</div>
          <div class="label">${esc(s.label)}</div>
          <div class="frac ${fail?'no':'ok'}">${s.score.passed} of ${s.score.total}</div>`;
        b.onclick = () => pick(i);
        box.appendChild(b);
      });
      requestAnimationFrame(drawEdges);
    }

    function drawEdges() {
      const svg = $('edges');
      const wrap = $('gwrap');
      const nodes = [...document.querySelectorAll('.orb')];
      if (nodes.length < 2) { svg.innerHTML = ''; return; }
      const wr = wrap.getBoundingClientRect();
      svg.setAttribute('viewBox', `0 0 ${wr.width} ${wr.height}`);
      let d = '';
      for (let i = 0; i < nodes.length - 1; i++) {
        const a = nodes[i].getBoundingClientRect();
        const b = nodes[i+1].getBoundingClientRect();
        const x1 = a.left + a.width/2 - wr.left;
        const y1 = a.top + a.height/2 - wr.top;
        const x2 = b.left + b.width/2 - wr.left;
        const y2 = b.top + b.height/2 - wr.top;
        const mx = (x1 + x2) / 2;
        d += `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2} `;
      }
      svg.innerHTML = `<path d="${d}" fill="none" stroke="rgba(20,20,20,0.14)" stroke-width="1.5"/>`;
    }

    function pick(i) {
      active = i;
      [...document.querySelectorAll('.node')].forEach((n, j) => n.classList.toggle('on', j===i));
      const s = cur.graph[i];
      $('title').textContent = s.label;
      $('blurb').textContent = s.blurb || '';
      const g = $('grades');
      g.innerHTML = s.grades.length ? '' : '<div class="empty">Nothing graded at this step.</div>';
      for (const x of s.grades) {
        const row = document.createElement('div');
        row.className = 'row';
        const crit = x.critical && !x.passed ? ' · required for PASS' : (x.critical ? ' · required for PASS' : '');
        row.innerHTML = `
          <div class="tag ${x.passed?'pass':'fail'}">${esc(x.verdict)}</div>
          <div>
            <strong>${esc(x.title)}</strong>
            <span class="why">${esc(x.why)}</span>
            <div class="meta"><em>${esc(x.kind_label)}</em>${esc(crit)}</div>
          </div>`;
        g.appendChild(row);
      }
      const runId = cur.run.run_id;
      const files = $('files');
      files.innerHTML = s.files.length ? '' : '<div class="empty">None for this step</div>';
      for (const f of s.files) {
        let href = '#';
        const p = (f.path||'').replaceAll('\\\\','/');
        if (p.includes(runId)) href = '/files/' + p.slice(p.indexOf(runId));
        else if (p.includes('artifacts')) {
          const parts = p.split('/');
          href = '/files/' + runId + '/' + parts.slice(parts.lastIndexOf('artifacts')).join('/');
        }
        const row = document.createElement('div');
        row.className = 'file';
        row.innerHTML = `<span class="soft">${esc((f.kind||'file').toUpperCase())}</span><a class="dl" href="${href}" download>${esc(p.split('/').pop())}</a>`;
        files.appendChild(row);
      }
      const tools = $('tools');
      tools.innerHTML = s.trace.length ? '' : '<div class="empty">None for this step</div>';
      for (const t of s.trace) {
        const row = document.createElement('div');
        row.className = 'act';
        const label = String(t.action || '').replaceAll('_', ' ');
        row.innerHTML = `<span>${esc(label)}</span><span class="soft">${t.ok ? 'ok' : 'error'}</span>`;
        tools.appendChild(row);
      }
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    boot();
  </script>
</body>
</html>
