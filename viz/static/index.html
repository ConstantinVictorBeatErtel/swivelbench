<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SwivelBench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #141414;
      --mute: #6b6b66;
      --line: rgba(20,20,20,0.1);
      --ok: #1a7a4c;
      --bad: #c43c3c;
      --node: #fff;
      --glow: rgba(20,20,20,0.06);
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(900px 480px at 80% -10%, rgba(26,122,76,0.07), transparent 55%),
        var(--bg);
      color: var(--ink);
      font: 400 15px/1.4 Outfit, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .shell { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }

    .top {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 20px; margin-bottom: 56px;
    }
    .brand {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 28px; letter-spacing: -0.02em;
    }
    .brand span { color: var(--mute); font-style: italic; }
    select {
      appearance: none; border: 1px solid var(--line); background: #fff;
      border-radius: 999px; padding: 9px 34px 9px 14px; font: 500 13px Outfit;
      color: var(--ink);
      background-image:
        linear-gradient(45deg, transparent 50%, var(--mute) 50%),
        linear-gradient(135deg, var(--mute) 50%, transparent 50%);
      background-position: calc(100% - 14px) 54%, calc(100% - 10px) 54%;
      background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
      max-width: min(420px, 55vw);
    }
    .score {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 56px; line-height: 1; letter-spacing: -0.03em;
    }
    .score small {
      display: block; margin-top: 4px;
      font: 500 11px/1.2 "IBM Plex Mono", monospace;
      color: var(--mute); letter-spacing: 0.04em;
    }

    /* Graph */
    .graph-wrap {
      position: relative;
      padding: 28px 8px 8px;
      margin-bottom: 36px;
    }
    svg.edges {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: visible;
    }
    .nodes {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    .node {
      border: 0; background: transparent; cursor: pointer;
      padding: 0; text-align: center; color: inherit;
      font: inherit;
    }
    .orb {
      width: 64px; height: 64px; margin: 0 auto 14px;
      border-radius: 50%;
      background: var(--node);
      border: 1px solid var(--line);
      box-shadow: 0 10px 30px var(--glow);
      display: grid; place-items: center;
      transition: transform .25s ease, border-color .2s, box-shadow .25s;
      font: 500 12px/1 "IBM Plex Mono", monospace;
      color: var(--mute);
    }
    .node:hover .orb, .node.on .orb {
      transform: translateY(-3px) scale(1.04);
      border-color: var(--ink);
      box-shadow: 0 16px 40px rgba(20,20,20,0.12);
      color: var(--ink);
    }
    .node.bad .orb { border-color: rgba(196,60,60,0.45); color: var(--bad); }
    .node.bad.on .orb, .node.bad:hover .orb {
      border-color: var(--bad);
      box-shadow: 0 16px 40px rgba(196,60,60,0.12);
    }
    .node.good .orb { border-color: rgba(26,122,76,0.4); }
    .node.good.on .orb { border-color: var(--ok); color: var(--ok); }
    .label {
      font-size: 13px; font-weight: 500; line-height: 1.25;
      max-width: 11ch; margin: 0 auto 6px;
    }
    .frac {
      font: 500 11px/1 "IBM Plex Mono", monospace;
      color: var(--mute);
    }
    .frac.ok { color: var(--ok); }
    .frac.no { color: var(--bad); }

    /* Detail */
    .detail {
      display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px;
    }
    @media (max-width: 820px) {
      .top { flex-wrap: wrap; }
      .detail { grid-template-columns: 1fr; }
      .nodes { min-width: 720px; }
      .graph-wrap { overflow-x: auto; }
    }
    .pane {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 26px 28px;
      min-height: 280px;
    }
    .pane h2 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 26px; font-weight: 400; margin-bottom: 18px;
    }
    .row {
      display: grid; grid-template-columns: 52px 1fr auto;
      gap: 12px; align-items: start;
      padding: 12px 0; border-top: 1px solid var(--line);
    }
    .row:first-of-type { border-top: 0; padding-top: 0; }
    .tag {
      font: 500 10px/1 "IBM Plex Mono", monospace;
      padding: 5px 7px; border-radius: 6px; width: fit-content;
    }
    .tag.pass { background: rgba(26,122,76,0.1); color: var(--ok); }
    .tag.fail { background: rgba(196,60,60,0.1); color: var(--bad); }
    .row strong { display: block; font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .row code {
      display: block; font: 400 11px/1.4 "IBM Plex Mono", monospace;
      color: var(--mute); word-break: break-word;
    }
    .kind { font: 500 10px "IBM Plex Mono", monospace; color: var(--mute); }
    .file, .act {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 10px 0; border-top: 1px solid var(--line);
      font-size: 13px;
    }
    .file:first-of-type, .act:first-of-type { border-top: 0; }
    a.dl {
      color: var(--ok); text-decoration: none; font-weight: 500;
      border-bottom: 1px solid rgba(26,122,76,0.3);
    }
    .mono { font: 400 11px "IBM Plex Mono", monospace; color: var(--mute); }
    .empty { color: var(--mute); font-size: 13px; padding-top: 8px; }
    .sec {
      font: 500 10px/1 "IBM Plex Mono", monospace;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--mute); margin: 18px 0 6px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div>
        <div class="brand">SwivelBench <span>graph</span></div>
        <select id="run" style="margin-top:14px"></select>
      </div>
      <div class="score" id="score">—<small id="sub">—</small></div>
    </div>

    <div class="graph-wrap" id="gwrap">
      <svg class="edges" id="edges"></svg>
      <div class="nodes" id="nodes"></div>
    </div>

    <div class="detail">
      <div class="pane">
        <h2 id="title">—</h2>
        <div id="grades"></div>
      </div>
      <div class="pane">
        <h2>Output</h2>
        <div class="sec">Files</div>
        <div id="files"></div>
        <div class="sec">Tools</div>
        <div id="tools"></div>
      </div>
    </div>
  </div>

  <script>
    let cur = null, active = 0;

    const $ = (id) => document.getElementById(id);

    async function boot() {
      const { runs } = await (await fetch('/api/runs')).json();
      const sel = $('run');
      sel.innerHTML = '';
      if (!runs.length) {
        sel.innerHTML = '<option>No runs</option>';
        return;
      }
      for (const r of runs) {
        const o = document.createElement('option');
        o.value = r.run_id;
        o.textContent = `${r.task} · ${(r.model||'').split('/').pop()} · ${Number(r.final).toFixed(2)}`;
        sel.appendChild(o);
      }
      sel.onchange = () => load(sel.value);
      await load(runs[0].run_id);
      window.addEventListener('resize', drawEdges);
    }

    async function load(id) {
      cur = await (await fetch('/api/run/' + encodeURIComponent(id))).json();
      const r = cur.run;
      $('score').innerHTML = `${Number(r.final).toFixed(2)}<small id="sub">raw ${Number(r.raw).toFixed(2)} · ${r.stop||''}</small>`;
      paintGraph();
      pick(0);
    }

    function paintGraph() {
      const box = $('nodes');
      box.innerHTML = '';
      cur.graph.forEach((s, i) => {
        const fail = s.score.total - s.score.passed;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'node ' + (fail ? 'bad' : 'good');
        b.innerHTML = `
          <div class="orb">${String(i+1).padStart(2,'0')}</div>
          <div class="label">${s.label}</div>
          <div class="frac ${fail?'no':'ok'}">${s.score.passed}/${s.score.total}</div>`;
        b.onclick = () => pick(i);
        box.appendChild(b);
      });
      requestAnimationFrame(drawEdges);
    }

    function drawEdges() {
      const svg = $('edges');
      const wrap = $('gwrap');
      const nodes = [...document.querySelectorAll('.orb')];
      if (nodes.length < 2) { svg.innerHTML = ''; return; }
      const wr = wrap.getBoundingClientRect();
      svg.setAttribute('viewBox', `0 0 ${wr.width} ${wr.height}`);
      let d = '';
      for (let i = 0; i < nodes.length - 1; i++) {
        const a = nodes[i].getBoundingClientRect();
        const b = nodes[i+1].getBoundingClientRect();
        const x1 = a.left + a.width/2 - wr.left;
        const y1 = a.top + a.height/2 - wr.top;
        const x2 = b.left + b.width/2 - wr.left;
        const y2 = b.top + b.height/2 - wr.top;
        const mx = (x1 + x2) / 2;
        d += `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2} `;
      }
      svg.innerHTML = `<path d="${d}" fill="none" stroke="rgba(20,20,20,0.14)" stroke-width="1.5"/>`;
    }

    function pick(i) {
      active = i;
      [...document.querySelectorAll('.node')].forEach((n, j) => n.classList.toggle('on', j===i));
      const s = cur.graph[i];
      $('title').textContent = s.label;
      const g = $('grades');
      g.innerHTML = s.grades.length ? '' : '<div class="empty">No grades</div>';
      for (const x of s.grades) {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
          <div class="tag ${x.passed?'pass':'fail'}">${x.passed?'pass':'fail'}</div>
          <div><strong>${x.id}${x.critical?' · crit':''}</strong><code>${esc(x.how||'')}</code></div>
          <div class="kind">${x.kind}</div>`;
        g.appendChild(row);
      }
      const runId = cur.run.run_id;
      const files = $('files');
      files.innerHTML = s.files.length ? '' : '<div class="empty">None</div>';
      for (const f of s.files) {
        let href = '#';
        const p = (f.path||'').replaceAll('\\\\','/');
        if (p.includes(runId)) href = '/files/' + p.slice(p.indexOf(runId));
        else if (p.includes('artifacts')) {
          const parts = p.split('/');
          href = '/files/' + runId + '/' + parts.slice(parts.lastIndexOf('artifacts')).join('/');
        }
        const row = document.createElement('div');
        row.className = 'file';
        row.innerHTML = `<span>${(f.kind||'file').toUpperCase()}</span><a class="dl" href="${href}" download>${p.split('/').pop()}</a>`;
        files.appendChild(row);
      }
      const tools = $('tools');
      tools.innerHTML = s.trace.length ? '' : '<div class="empty">None</div>';
      for (const t of s.trace) {
        const row = document.createElement('div');
        row.className = 'act';
        row.innerHTML = `<span>${t.action}</span><span class="mono">${t.ok?'ok':'err'}</span>`;
        tools.appendChild(row);
      }
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    boot();
  </script>
</body>
</html>
