<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwivelBench · Credit book</title><style>
:root{--ink:#18222d;--muted:#6c7783;--line:#dfe5eb;--bg:#f4f6f8;--card:#fff;--blue:#2d6cdf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif}.wrap{max-width:1180px;margin:auto;padding:30px 24px 70px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.brand{font-size:25px;font-weight:750;color:#17324d}.muted{color:var(--muted)}.controls{display:flex;gap:8px;align-items:center}.controls input,.controls select{border:1px solid var(--line);background:#fff;border-radius:5px;padding:8px}.controls button{background:var(--blue);color:#fff;border:0;border-radius:5px;padding:9px 13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:25px}.card,.detail{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:17px}.card{cursor:pointer}.card:hover{border-color:var(--blue)}.card h2{font-size:19px;margin:0}.tag{display:inline-block;font-size:11px;color:#1757ad;background:#eef5ff;padding:4px 7px;border-radius:4px;margin:8px 0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.facts span{display:block;color:var(--muted);font-size:11px}.facts b{font-size:14px}.detail{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:22px}.detail h2{margin:0 0 8px}.layout{display:flex;flex-wrap:wrap;gap:7px}.layout span{padding:6px 8px;border:1px solid var(--line);border-radius:5px;font-size:12px}.layout span.on{border-color:var(--blue);color:var(--blue);background:#f1f6ff}@media(max-width:700px){.detail{grid-template-columns:1fr}.top{display:block}.controls{margin-top:15px}}
</style></head><body><main class="wrap"><div class="top"><div><div class="brand">SwivelBench · Credit book</div><p class="muted">Pinned public-company facts and randomized credit-request layouts</p></div><div class="controls"><label class="muted" for="seed">scenario</label><input id="seed" value="51000" size="7"><button id="load">Load</button></div></div><section class="grid" id="companies"></section><section class="detail"><div><h2 id="scenario">Select a borrower</h2><p class="muted" id="request">Scenario details appear here.</p><div class="facts" id="facts"></div></div><div><h2>Report layout</h2><div class="layout" id="layout"></div></div></section></main><script>
let catalog=null;const $=x=>document.getElementById(x);const fmt=x=>Number(x).toLocaleString(undefined,{maximumFractionDigits:2});async function init(){catalog=await (await fetch('/api/credit/catalog')).json();$('companies').innerHTML=catalog.companies.map(c=>`<article class="card" data-ticker="${c.ticker}"><h2>${c.ticker}</h2><div>${c.legal_name}</div><div class="tag">${c.background}</div><div class="facts"><div><span>Revenue</span><b>${fmt(c.financials.revenue)}</b></div><div><span>EBITDA</span><b>${fmt(c.financials.ebitda)}</b></div></div></article>`).join('');document.querySelectorAll('.card').forEach(x=>x.onclick=()=>loadScenario(catalog.companies.find(c=>c.ticker===x.dataset.ticker)));loadScenario();}async function loadScenario(company){let s=await (await fetch('/api/credit/scenario/'+(Number($('seed').value)||51000))).json();if(company&&s.ticker!==company.ticker){let n=catalog.companies.findIndex(c=>c.ticker===company.ticker);s=await (await fetch('/api/credit/scenario/'+(51000+n))).json()}$('scenario').textContent=`${s.ticker} · ${s.company}`;$('request').textContent=`${s.report_type.replaceAll('_',' ')} · ${s.request.facility} · ${s.request.amount}m for ${s.request.purpose}`;$('facts').innerHTML=Object.entries(s.facts).map(([k,v])=>`<div><span>${k.replaceAll('_',' ')}</span><b>${typeof v==='number'?fmt(v):v}</b></div>`).join('');$('layout').innerHTML=s.layout.map(x=>`<span class="on">${x}</span>`).join('')}$('load').onclick=()=>loadScenario();init();</script></body></html>
